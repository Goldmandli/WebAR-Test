<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gebäudealter AR – Kanton Zürich</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#fff;font:15px/1.4 system-ui,sans-serif;overflow:hidden}
  video,canvas{position:fixed;inset:0;width:100%;height:100%}
  video{object-fit:cover}
  canvas{touch-action:none}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#111;z-index:5;padding:24px;text-align:center}
  #start button,#start label{background:#f2c14e;color:#111;border:0;padding:14px 22px;border-radius:10px;font-size:16px;font-weight:600}
  #start small{opacity:.7;max-width:36ch}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55);z-index:4;font-size:13px}
  #hud input{width:100%}
  #dbg{opacity:.7;font-size:11px;word-break:break-all}
</style>
</head>
<body>
<div id="start">
  <h2 style="margin:0">Gebäudealter AR</h2>
  <small>Kamera, Standort und Kompass werden benötigt. Halte das Handy aufrecht und ziele auf ein Haus. Daten: Gebäudealter (OGD), Kanton Zürich.</small>
  <button id="go">Starten</button>
  <label>Eigene GeoJSON-Datei (Notlösung)<input id="file" type="file" accept=".geojson,.json" hidden></label>
  <small id="msg"></small>
</div>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="hud">
  <div id="leg" style="display:flex;height:10px;border-radius:3px;overflow:hidden"></div>
  <div style="display:flex;justify-content:space-between;font-size:11px;opacity:.75;margin-bottom:4px"><span>vor 1919</span><span>ab 2021</span></div>
  <div id="status">Warte auf GPS …</div>
  <div id="dbg"></div>
  Sichtfeld (horizontal): <span id="fovv">55</span>°
  <input id="fov" type="range" min="35" max="90" value="55">
  <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
    <span style="flex:1;opacity:.8">Mit 1 Finger verschieben, mit 2 Fingern zoomen</span>
    <button id="reset" style="background:#333;color:#fff;border:1px solid #666;border-radius:8px;padding:6px 10px">Zurücksetzen</button>
  </div>
</div>

<script>
/* ===== Konfiguration ===== */
const CFG = {
  wfs: 'https://maps.zh.ch/wfs/OGDZHWFS',
  layer: 'ms:ogd-0415_stat_gebaeudealter_f',   // Gebäudealter (OGD), Kanton Zürich
  fieldYear: '',          // leer = automatisch erkennen (baujahr / bauperiode / alter …); sonst exakten Attributnamen eintragen
  fieldHeight: '',        // optional: Attribut mit Gebäudehöhe
  defaultHeight: 10,      // m
  camHeight: 1.6,         // Augenhöhe in m
  radius: 150,            // Zeichenradius in m
  fetchRadius: 220,       // WFS-Abfrageradius in m
  refetchDist: 60         // neu laden nach so vielen Metern Bewegung
};

/* ===== Zustand ===== */
let feats = [], pos = null, lastFetch = null, busy = false, heading = 0, pitch = 0, hfov = 55, yearKey = null;
let userDX = 0, userDY = 0, userScale = 1;   // manuelle Verschiebung (px) / Skalierung, vom Nutzer per Touch gesetzt
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const rad = Math.PI/180, deg = 180/Math.PI;

/* ===== WGS84 → LV95 (swisstopo-Näherung, ~1 m) ===== */
function wgs2lv95(lat, lon){
  const p = (lat*3600 - 169028.66)/10000, l = (lon*3600 - 26782.5)/10000;
  return {
    e: 2600072.37 + 211455.93*l - 10938.51*l*p - 0.36*l*p*p - 44.54*l*l*l,
    n: 1200147.07 + 308807.95*p + 3745.25*l*l + 76.63*p*p - 194.56*l*l*p + 119.79*p*p*p
  };
}

/* ===== Daten laden (WFS, GeoJSON in LV95) ===== */
function parseGeoJSON(gj, isWgs){
  const out = [];
  for(const f of gj.features || []){
    const g = f.geometry; if(!g || !/Polygon/.test(g.type)) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    const rings = polys.map(p => p[0].map(([a,b]) => {
      if(isWgs) { const c = wgs2lv95(b,a); return [c.e,c.n]; }
      return a > b ? [a,b] : [b,a];            // E (~2.6 Mio) muss vor N (~1.2 Mio) stehen
    }));
    out.push({ props: f.properties || {}, rings });
  }
  return out;
}
async function fetchData(){
  if(busy || !pos) return; busy = true;
  const r = CFG.fetchRadius, crs = 'urn:ogc:def:crs:EPSG::2056';
  const url = `${CFG.wfs}?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=${CFG.layer}` +
    `&SRSNAME=${crs}&OUTPUTFORMAT=${encodeURIComponent('application/json; subtype=geojson')}&COUNT=2000` +
    `&BBOX=${pos.e-r},${pos.n-r},${pos.e+r},${pos.n+r},${crs}`;
  try{
    const res = await fetch(url); const gj = await res.json();
    feats = parseGeoJSON(gj, false); lastFetch = { e:pos.e, n:pos.n };
    yearKey = null;
    $('msg').textContent = feats.length + ' Gebäude geladen';
  }catch(e){
    $('dbg').textContent = 'WFS-Abfrage fehlgeschlagen (' + e.message + ') – ggf. CORS. Alternative: GeoJSON-Datei wählen.';
  }
  busy = false;
}
$('file').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const gj = JSON.parse(await f.text()); const c = gj.features[0].geometry.coordinates.flat(3)[0];
  feats = parseGeoJSON(gj, Math.abs(c) < 180); lastFetch = { e:1e9, n:1e9 }; yearKey = null;
  $('msg').textContent = feats.length + ' Gebäude aus Datei';
};

/* ===== Bauperioden & Farben (Viridis, ähnlich GIS-Browser) ===== */
const PERIODS = [[0,1849,'vor 1850'],[1850,1899,'1850–1899'],[1900,1918,'1900–1918'],[1919,1945,'1919–1945'],[1946,1960,'1946–1960'],[1961,1970,'1961–1970'],
  [1971,1980,'1971–1980'],[1981,1985,'1981–1985'],[1986,1990,'1986–1990'],[1991,1995,'1991–1995'],
  [1996,2000,'1996–2000'],[2001,2005,'2001–2005'],[2006,2010,'2006–2010'],[2011,2015,'2011–2015'],
  [2016,2020,'2016–2020'],[2021,9999,'ab 2021']];
const VIR = [[0,'#440154'],[.13,'#482878'],[.25,'#3e4989'],[.38,'#31688e'],[.5,'#26828e'],
  [.63,'#1f9e89'],[.75,'#35b779'],[.88,'#6ece58'],[.94,'#b5de2b'],[1,'#fde725']];
function viridis(t){
  let i = 1; while(i < VIR.length-1 && t > VIR[i][0]) i++;
  const [t0,c0] = VIR[i-1], [t1,c1] = VIR[i], f = (t-t0)/(t1-t0);
  const a = [1,3,5].map(k => parseInt(c0.substr(k,2),16)), b = [1,3,5].map(k => parseInt(c1.substr(k,2),16));
  return 'rgb(' + a.map((v,k) => Math.round(v + (b[k]-v)*f)).join(',') + ')';
}
const COLORS = PERIODS.map((_,i) => viridis(i/(PERIODS.length-1)));
$('leg').innerHTML = COLORS.map(c => `<div style="flex:1;background:${c}"></div>`).join('');

/* ===== Attribute auslesen ===== */
function findYearKey(props){
  if(CFG.fieldYear) return CFG.fieldYear;
  const keys = Object.keys(props);
  for(const re of [/^(gbauj|baujahr)/i, /^(gbaup|bauperiode)/i, /bauj|baup|gebaeudealter|alter|jahr|period/i]){
    const k = keys.find(k => re.test(k)); if(k) return k;
  }
  return null;
}
function ageInfo(props){
  const k = yearKey || (yearKey = findYearKey(props));
  const raw = k ? props[k] : null, s = String(raw ?? '');
  const ys = s.match(/\d{4}/g);
  if(!ys) return { text: s !== '' ? s : 'Baujahr unbekannt', cls: -1, year: NaN };
  const v = +ys[0];
  // GWR-Codes 8011–8024 stehen für feste Registerklassen (8011=vor 1919 ... 8024=ab 2021).
  // Wir bilden sie auf ein typisches Jahr ab und lassen die normale Einordnung unten entscheiden,
  // damit auch bei GWR-Codes die feineren Klassen vor 1919 (falls das echte Baujahr bekannt ist) greifen.
  if(ys.length === 1 && v >= 8011 && v <= 8024){
    const GWR_YEAR = {8011:1900,8012:1932,8013:1953,8014:1966,8015:1976,8016:1983,8017:1988,
      8018:1993,8019:1998,8020:2003,8021:2008,8022:2013,8023:2018,8024:2022};
    const y = GWR_YEAR[v];
    return { text: 'Bauperiode (Register)', cls: PERIODS.findIndex(p => y >= p[0] && y <= p[1]), year: NaN };
  }
  const y = ys.map(Number), m = y.reduce((a,b) => a+b, 0)/y.length;
  return { text: y.length > 1 ? `Bauperiode ${y[0]}–${y[1]}` : `Baujahr ${y[0]}`,
           cls: PERIODS.findIndex(p => m >= p[0] && m <= p[1]), year: y.length > 1 ? NaN : y[0] };
}

/* ===== Geometrie ===== */
function localRings(f){
  return f.rings.map(r => r.map(([e,n]) => ({ x:e-pos.e, y:n-pos.n })));
}
function nearby(){
  const out = [];
  for(const f of feats){
    const rs = localRings(f), c = rs[0][0];
    if(Math.hypot(c.x,c.y) <= CFG.radius) out.push({ f, rs });
  }
  return out;
}
function pickTarget(list){                       // Strahl in Blickrichtung → erstes Gebäude
  const dx = Math.sin(heading*rad), dy = Math.cos(heading*rad);
  let best = null, bestT = Infinity;
  for(const b of list) for(const ring of b.rs)
    for(let i=0;i<ring.length-1;i++){
      const p = ring[i], q = ring[i+1], ex = q.x-p.x, ey = q.y-p.y, den = dx*ey - dy*ex;
      if(Math.abs(den) < 1e-9) continue;
      const t = (p.x*ey - p.y*ex)/den, u = (p.x*dy - p.y*dx)/den;
      if(t > 0 && u >= 0 && u <= 1 && t < bestT){ bestT = t; best = b; }
    }
  return best;
}
function r0Center(b){
  const r0 = b.rs[0];
  return { x: r0.reduce((s,p)=>s+p.x,0)/r0.length, y: r0.reduce((s,p)=>s+p.y,0)/r0.length };
}
function project(x, y, z){
  const az = Math.atan2(x, y)*deg, rel = ((az - heading + 540) % 360) - 180;
  if(Math.abs(rel) > 85) return null;
  const d = Math.hypot(x, y), el = Math.atan2(z - CFG.camHeight, d)*deg - pitch;
  const W = cv.width, H = cv.height, th = Math.tan(hfov/2*rad), tv = th*H/W;
  return { x: W/2 + Math.tan(rel*rad)/th*W/2, y: H/2 - Math.tan(el*rad)/tv*H/2 };
}
function adjust(p){                                     // manuelle Verschiebung/Skalierung des Nutzers einrechnen
  if(!p) return p;
  const cx = cv.width/2, cy = cv.height/2;
  return { x: cx + (p.x-cx)*userScale + userDX*devicePixelRatio,
           y: cy + (p.y-cy)*userScale + userDY*devicePixelRatio };
}

/* ===== Zeichnen ===== */
function draw(){
  cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio;
  ctx.clearRect(0,0,cv.width,cv.height);
  if(pos && feats.length){
    const list = nearby(), target = pickTarget(list), now = new Date().getFullYear();
    // Von hinten nach vorne zeichnen (Malers-Algorithmus): nähere Gebäude übermalen weiter entfernte,
    // dadurch bleiben nur die vordersten, sichtbaren Gebäude stehen.
    for(const b of list){
      const r0 = b.rs[0];
      b._d = Math.min(...r0.map(p => Math.hypot(p.x,p.y)));
    }
    list.sort((a,b) => b._d - a._d);
    ctx.lineWidth = 2*devicePixelRatio;
    for(const b of list){
      const isT = b === target, info = ageInfo(b.f.props);
      const age = now - info.year, col = info.cls >= 0 ? COLORS[info.cls] : '#aaa';
      const h = +b.f.props[CFG.fieldHeight] || CFG.defaultHeight;
      for(const ring of b.rs){
        const gr = ring.map(p => adjust(project(p.x,p.y,0))), rf = ring.map(p => adjust(project(p.x,p.y,h)));
        for(let i=0;i<ring.length-1;i++){
          const q = [gr[i],gr[i+1],rf[i+1],rf[i]];
          if(q.some(v => !v)) continue;
          ctx.beginPath(); q.forEach((v,k) => k ? ctx.lineTo(v.x,v.y) : ctx.moveTo(v.x,v.y)); ctx.closePath();
          ctx.globalAlpha = isT ? .6 : .4; ctx.fillStyle = col; ctx.fill();   // leicht transparent, Verdeckung bleibt durch Zeichenreihenfolge erhalten
          ctx.strokeStyle = isT ? '#fff' : col; ctx.lineWidth = (isT ? 3 : 1.5)*devicePixelRatio; ctx.stroke();
        }
      }
      if(isT){
        const cx = r0Center(b), s = adjust(project(cx.x, cx.y, h*0.6)), txt = info.text + (isNaN(age) ? '' : ` (${Math.round(age)} J.)`);
        const fs = 20*devicePixelRatio, x = s ? s.x : cv.width/2, y = s ? s.y : cv.height/2;
        ctx.globalAlpha = 1; ctx.font = `700 ${fs}px system-ui`; ctx.textAlign = 'center';
        const w = ctx.measureText(txt).width + 24*devicePixelRatio;
        ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(x-w/2, y-fs, w, fs*1.7);
        ctx.fillStyle = col; ctx.fillText(txt, x, y+fs*0.3);
        $('dbg').textContent = JSON.stringify(b.f.props).slice(0,500);   // Attribute zum Prüfen
      }
    }
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  const m = [cv.width/2, cv.height/2]; ctx.beginPath();
  ctx.moveTo(m[0]-12,m[1]); ctx.lineTo(m[0]+12,m[1]); ctx.moveTo(m[0],m[1]-12); ctx.lineTo(m[0],m[1]+12); ctx.stroke();
  requestAnimationFrame(draw);
}

/* ===== Sensoren ===== */
const smooth = (cur, next, k=0.25) => (cur + (((next-cur+540)%360)-180)*k + 360) % 360;
function onOrient(e){
  let h;
  if(e.webkitCompassHeading != null) h = e.webkitCompassHeading;             // iOS
  else if(e.alpha != null){                                                  // Android
    const a = e.alpha*rad, b = (e.beta||0)*rad, g = (e.gamma||0)*rad;
    const vx = -Math.cos(a)*Math.sin(g) - Math.sin(a)*Math.sin(b)*Math.cos(g);
    const vy = -Math.sin(a)*Math.sin(g) + Math.cos(a)*Math.sin(b)*Math.cos(g);
    h = Math.atan2(vx, vy)*deg; if(h < 0) h += 360;
  } else return;
  heading = smooth(heading, h);
  if(e.beta != null) pitch = pitch*0.75 + (e.beta - 90)*0.25;
}
async function start(){
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
      if(await DeviceOrientationEvent.requestPermission() !== 'granted') throw new Error('Kompass verweigert');
    }
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
    $('v').srcObject = stream; await $('v').play();
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', e => { if(!('ondeviceorientationabsolute' in window)) onOrient(e); }, true);
    let acc = 0;
    navigator.geolocation.watchPosition(p => {
      const c = wgs2lv95(p.coords.latitude, p.coords.longitude); pos = c; acc = p.coords.accuracy;
      if(!lastFetch || Math.hypot(c.e-lastFetch.e, c.n-lastFetch.n) > CFG.refetchDist) fetchData();
    }, err => $('status').textContent = 'GPS-Fehler: ' + err.message, { enableHighAccuracy:true, maximumAge:1000 });
    setInterval(() => $('status').textContent = pos
      ? `GPS ±${Math.round(acc)} m · Blick ${Math.round(heading)}° · ${feats.length} Gebäude` : 'Warte auf GPS …', 400);
    $('start').style.display = 'none';
    draw();
  }catch(e){ $('msg').textContent = 'Fehler: ' + e.message + ' (HTTPS nötig!)'; }
}
$('go').onclick = start;
$('fov').oninput = e => { hfov = +e.target.value; $('fovv').textContent = hfov; };
$('reset').onclick = () => { userDX = 0; userDY = 0; userScale = 1; };

/* ===== Touch: 1 Finger verschiebt, 2 Finger zoomen die Gebäude-Overlays ===== */
const touches = new Map();
let panBase = null, pinchBase = null;
function pinchDist(){
  const [a,b] = [...touches.values()];
  return Math.hypot(a.x-b.x, a.y-b.y);
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(touches.size === 1) panBase = { x:e.clientX, y:e.clientY, dx:userDX, dy:userDY };
  if(touches.size === 2) pinchBase = { dist: pinchDist(), scale: userScale };
});
cv.addEventListener('pointermove', e => {
  if(!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(touches.size === 1 && panBase){
    userDX = panBase.dx + (e.clientX - panBase.x);
    userDY = panBase.dy + (e.clientY - panBase.y);
  } else if(touches.size === 2 && pinchBase){
    userScale = Math.min(6, Math.max(0.2, pinchBase.scale * (pinchDist() / pinchBase.dist)));
  }
});
function endTouch(e){
  touches.delete(e.pointerId);
  if(touches.size === 1){ const [p] = [...touches.values()]; panBase = { x:p.x, y:p.y, dx:userDX, dy:userDY }; pinchBase = null; }
  else if(touches.size === 0){ panBase = null; pinchBase = null; }
}
cv.addEventListener('pointerup', endTouch);
cv.addEventListener('pointercancel', endTouch);
</script>
</body>
</html>
